  gold.dim_date:
    description: Calendar table, one row per day from 2016-01-01 to 2018-12-31. Join on fact_orders.purchase_date
      for weekday, weekend, month or quarter analyses.
    row_count: 1096
    columns:
      date:
        description: Calendar day. Primary key.
        type: DATE
      year:
        description: Year (e.g. 2017).
        type: BIGINT
      quarter:
        description: Quarter of the year, 1 to 4.
        type: BIGINT
      month:
        description: Month number, 1 to 12.
        type: BIGINT
      month_name:
        description: Month name in English.
        type: VARCHAR
        sample_values:
        - August
        - December
        - January
        - July
        - March
        - May
        - October
        - April
        - June
        - November
        - September
        - February
      day:
        description: Day of the month, 1 to 31.
        type: BIGINT
      day_of_week:
        description: 'ISO day of week: 1 = Monday ... 7 = Sunday.'
        type: BIGINT
      day_name:
        description: Day name in English.
        type: VARCHAR
        sample_values:
        - Friday
        - Monday
        - Saturday
        - Sunday
        - Thursday
        - Tuesday
        - Wednesday
      is_weekend:
        description: True on Saturday and Sunday.
        type: BOOLEAN
