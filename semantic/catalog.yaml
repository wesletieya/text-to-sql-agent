- gold.fact_order_items.order_id = gold.fact_orders.order_id
- gold.fact_order_items.product_id = gold.dim_product.product_id
- gold.fact_order_items.seller_id = gold.dim_seller.seller_id
- gold.fact_payments.order_id = gold.fact_orders.order_id
- gold.fact_reviews.order_id = gold.fact_orders.order_id
- tpch.nation.n_regionkey = tpch.region.r_regionkey
- tpch.customer.c_nationkey = tpch.nation.n_nationkey
- tpch.supplier.s_nationkey = tpch.nation.n_nationkey
- tpch.orders.o_custkey = tpch.customer.c_custkey
- tpch.lineitem.l_orderkey = tpch.orders.o_orderkey
- tpch.lineitem.l_partkey = tpch.part.p_partkey
- tpch.lineitem.l_suppkey = tpch.supplier.s_suppkey
- tpch.partsupp.ps_partkey = tpch.part.p_partkey
- tpch.partsupp.ps_suppkey = tpch.supplier.s_suppkey
glossary:
  revenue:
    synonyms:
    - sales
    - turnover
    - chiffre d'affaires
    - CA
    definition: Sum of item prices, excluding freight, for orders that are not canceled or unavailable,
      dated by purchase date.
    sql: SUM(items_value) FROM gold.fact_orders WHERE order_status NOT IN ('canceled', 'unavailable')
    rationale: Freight is not a product sale; canceled orders earned nothing.
  customer:
    definition: A person, identified by customer_unique_id.
    sql: COUNT(DISTINCT customer_unique_id)
  active customer:
    definition: Customer with at least one order that is not canceled or unavailable in the 12 months
      before the last purchase date in the data (2018-10-17).
    sql: purchase_date > (SELECT max(purchase_date) FROM gold.fact_orders) - INTERVAL 12 MONTH
    rationale: 'The data ends in October 2018: CURRENT_DATE would return no customer.'
  repeat customer:
    definition: Customer with two or more orders.
    sql: HAVING COUNT(DISTINCT order_id) >= 2, grouped by customer_unique_id
  late delivery:
    synonyms:
    - delay
    - retard
    definition: A delivered order received after its estimated delivery date.
    sql: is_late = true
  late delivery rate:
    definition: Share of delivered orders that were late. Computed on delivered orders only.
    sql: AVG(CAST(is_late AS INTEGER)) FROM gold.fact_orders WHERE order_status = 'delivered' AND is_late
      IS NOT NULL
    rationale: Orders still in transit would otherwise lower the rate artificially.
  average order value:
    synonyms:
    - AOV
    - panier moyen
    definition: Revenue divided by the number of orders, with the revenue filters.
    sql: AVG(items_value) FROM gold.fact_orders WHERE order_status NOT IN ('canceled', 'unavailable')
  data period:
    definition: Olist data covers purchases from 2016-09-04 to 2018-10-17. 'Last year' or 'recent' must
      be relative to 2018-10-17, never to CURRENT_DATE.
